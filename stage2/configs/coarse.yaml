seed: 42
stage: coarse
output_dir: outputs/coarse
resume: null
data:
  manifest: data/train.jsonl
  val_manifest: data/val.jsonl
  num_workers: 4
  batch_size: 1
  geometry_stats: weights/coarse_geometry_stats.pt
model:
  training_mode: lora
  vjepa_checkpoint: weights/vjepa2_1_vitb_dist_vitG_384.pt
  vjepa_factory: null
  vjepa_checkpoint_key: ema_encoder
  rfdetr_checkpoint: weights/rfdetr_small.pth
  rfdetr_factory: null
  depth_checkpoint: weights/depth_anything_v2_small.pth
  depth_factory: null
  depth_closer_is_larger: null # Set only after checking the local depth adapter.
  geometry_batch_size: 4
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
tracking:
  detection_threshold: 0.20
  max_center_distance: 0.20
  max_match_cost: 0.65
  max_gap: 2
  loom_clip: 0.69314718056
optimization:
  epochs: 20
  accumulation_steps: 1
  mixed_precision: "no"
  lora_lr: 0.0001
  new_lr: 0.0003
  weight_decay: 0.05
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
logging:
  log_every: 20
  val_every: 1
