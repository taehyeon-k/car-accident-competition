seed: 42
stage: joint
output_dir: car-accident/runs/joint_online_new
resume: null
data:
  manifest: data/stage2/manifests/train.jsonl
  val_manifest: data/stage2/manifests/val.jsonl
  num_workers: 2
  # Samples held in host RAM = num_workers x prefetch_factor x batch_size.
  # Each 512-frame sample is ~0.84 GiB, so this product drives host OOM risk.
  prefetch_factor: 1
  batch_size: 2
model:
  training_mode: online_lora
  geometry_dim: 9
  temporal_radius: 16
  hidden_dim: 256
  roi_dim: 192
  geometry_embedding_dim: 64
  spatial:
    layers: 1
    heads: 8
    ffn_dim: 768
    dropout: 0.20
  temporal:
    hybrid_blocks: 2
    heads: 8
    ffn_dim: 768
    dropout: 0.20
  attribute_hidden_dim: 64
  attribute_dropout: 0.15
  vjepa_clip_batch_size: 1
  vjepa_activation_checkpointing: true
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.10
  dino_lora_blocks: 1
  vjepa_lora_blocks: 1
  dino_checkpoint: pretrained/dinov3_vitb16/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  dino_factory: stage2.model.local_assets:dino
  dino_batch_size: 8
  vjepa_checkpoint: pretrained/vjepa2_1_vitl/vjepa2_1_vitl_dist_vitG_384.pt
  vjepa_factory: stage2.model.local_assets:vjepa
  vjepa_checkpoint_key: ema_encoder
  rfdetr_checkpoint: pretrained/rfdetr_small/rf-detr-small.pth
  rfdetr_factory: stage2.model.local_assets:detector
  geometry_batch_size: 4
tracking:
  detection_threshold: 0.3
  max_center_distance: 0.3
  max_match_cost: 0.65
  max_gap: 2
  track_percentile: 90
# GPU-memory control only. Independent of the semantic policy below, applied
# after it, and never applied to validation or inference. Null disables it.
training_memory:
  max_frames: 512
temporal_augmentation:
  full_video: 0.70
  ordinary_crop: 0.30
  pre_video_entry: 0
augmentation:
  horizontal_flip:
    probability: 0.50
  photometric:
    brightness:
      probability: 0.35
      factor_min: 0.75
      factor_max: 1.25
    contrast:
      probability: 0.35
      factor_min: 0.80
      factor_max: 1.20
    gamma:
      probability: 0.5
      gamma_min: 0.85
      gamma_max: 1.15
    saturation:
      probability: 0.25
      factor_min: 0.80
      factor_max: 1.20
    jpeg:
      # Disabled: a PIL encode+decode round trip per frame was the single most
      # expensive photometric op. Raise to re-enable.
      probability: 0.0
      quality_min: 60
      quality_max: 95
    gaussian_blur:
      probability: 0.2
      kernel_size: 5
      sigma_min: 0.10
      sigma_max: 1.20
    gaussian_noise:
      probability: 0.15
      std_min: 0.005
      std_max: 0.025
loss:
  entry_sigma_seconds: 0.20
  collision_sigma_seconds: 0.10
optimization:
  epochs: 20
  accumulation_steps: 2
  mixed_precision: bf16
  dino_lora_lr: 5.0e-6
  vjepa_lora_lr: 5.0e-6
  new_lr: 3.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.08
  grad_clip_norm: 1.0
early_stopping:
  enabled: true
  monitor: competition_score
  mode: max
  patience: 4
  min_delta: 0.002 
logging:
  log_every: 10
  checkpoint_metric: competition_score
  val_every: 1
  wandb:
    enabled: True
    project: Car_Accident_Competition
    entity: null
    name: joint-online-lora-dinov3-vjepa21s-new
    group: null
    tags: [joint, dinov3, vjepa2.1]
    mode: online
    run_id: null
    resume: never
root_dir: /workspace
