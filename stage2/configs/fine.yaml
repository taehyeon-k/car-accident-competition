seed: 42
stage: fine
output_dir: outputs/fine
resume: null
data:
  manifest: data/train.jsonl
  val_manifest: data/val.jsonl
  num_workers: 2
  batch_size: 4
  geometry_stats: weights/fine_geometry_stats_t64.pt
model:
  training_mode: lora
  T_max: 64
  feature_dim: 768
  frame_batch_size: 8
  dino_checkpoint: weights/dinov2_base/model.safetensors
  dino_factory: null
  rfdetr_checkpoint: weights/rfdetr_small.pth
  rfdetr_factory: null
  depth_checkpoint: weights/depth_anything_v2_small.pth
  depth_factory: null
  depth_closer_is_larger: null
  geometry_batch_size: 4
  lora_rank: 16
  unfreeze_last_blocks: 4
  lora_alpha: 16
  lora_dropout: 0.05
tracking:
  detection_threshold: 0.20
  max_center_distance: 0.20
  max_match_cost: 0.65
  max_gap: 2
  loom_clip: 0.69314718056
optimization:
  epochs: 20
  accumulation_steps: 2
  mixed_precision: "bf16"
  lora_lr: 0.0001
  new_lr: 0.0003
  weight_decay: 0.05
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
logging:
  log_every: 20
  val_every: 1
  wandb:
    enabled: false
    project: stage2-localizer
    entity: null
    name: fine
    group: null
    tags: [fine]
    mode: offline
    run_id: null
    resume: never
