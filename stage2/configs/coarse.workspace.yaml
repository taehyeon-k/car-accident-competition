seed: 42
stage: coarse
output_dir: runs/coarse
resume: null
data:
  manifest: data/stage2/manifests/train.jsonl
  val_manifest: data/stage2/manifests/val.jsonl
  num_workers: 4
  batch_size: 1
  geometry_stats: cache/coarse_geometry_stats.pt
model:
  training_mode: lora
  vjepa_checkpoint: pretrained/vjepa2_1_vitb/vjepa2_1_vitb_dist_vitG_384.pt
  vjepa_factory: stage2.model.local_assets:vjepa
  vjepa_checkpoint_key: ema_encoder
  rfdetr_checkpoint: pretrained/rfdetr_small/rf-detr-small.pth
  rfdetr_factory: stage2.model.local_assets:detector
  depth_checkpoint: pretrained/depth_anything_v2_small/model.safetensors
  depth_factory: stage2.model.local_assets:depth
  depth_closer_is_larger: true
  geometry_batch_size: 2
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
tracking:
  detection_threshold: 0.2
  max_center_distance: 0.2
  max_match_cost: 0.65
  max_gap: 2
  loom_clip: 0.69314718056
optimization:
  epochs: 20
  accumulation_steps: 4
  mixed_precision: bf16
  lora_lr: 0.0001
  new_lr: 0.0003
  weight_decay: 0.05
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
logging:
  log_every: 20
  val_every: 1
  wandb:
    enabled: false
    project: stage2-localizer
    entity: null
    name: coarse
    group: null
    tags:
    - coarse
    mode: offline
    run_id: null
    resume: never
root_dir: /workspace
