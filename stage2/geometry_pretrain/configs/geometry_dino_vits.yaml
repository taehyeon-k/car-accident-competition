# Base configuration: geometry-aware DINOv3 ViT-S/16 pretraining.
seed: 0
output_dir: /workspace/outputs/geometry_pretrain/runs/base
min_free_gb: 12            # disk guard: abort before crossing the safety margin
tasks: [road, depth, objects, contact, camera, flow]
model:
  arch: vits16
  checkpoint: /workspace/pretrained/dinov3_vits16/dinov3_vits16_pretrain_lvd1689m-timm-converted.pth
  dinov3_source: /workspace/pretrained/dinov3-source
  trainable_blocks: 0      # Phase 0: fully frozen
  out_blocks: [-1]         # final-norm tokens = what Stage 2 consumes
  head_dim: 128
  grad_checkpointing: false
loss_weights:
  road: 1.0                # drivable 3-class CE (boundary-weighted)
  lane_boundary: 1.0       # lane markings BCE + Dice
  road_edge: 0.5           # curb BCE + Dice
  depth: 0.5               # SSI + gradient matching on relative inverse depth
  object: 1.0              # compact 6-class taxonomy
  contact: 0.5             # vehicle-road contact band
  camera: 1.0              # vanishing point
  flow: 0.5                # stride-4 correspondence
weighting: manual          # manual | uncertainty
anchor:
  feature: 0.0
  gram: 0.0
loss:
  boundary_boost: 2.0
  lane_pos_weight: 4.0
  curb_pos_weight: 4.0
  contact_pos_weight: 5.0
  depth_grad_weight: 0.5
  object_class_weights: [0.5, 1.0, 1.0, 1.0, 1.5, 1.5]
data:
  manifest_dir: /workspace/cache/geometry_pretrain/manifests
  static_weights: {bdd100k: 0.70, tusimple: 0.10, accident: 0.14, baton: 0.06}
  pair_weights: {tusimple: 0.45, accident: 0.40, baton: 0.15}
  batch_size: 12
  pair_batch_size: 4
  workers: 5
  pair_workers: 3
  flow_min_consistent: 0.3
  labels:
    pseudo_road_weight: 0.7
    pseudo_object_weight: 0.7
    depth_min_conf: 0.3
  augment:
    photometric: {p_color: 0.8, brightness: [0.75, 1.25], contrast: [0.8, 1.2], saturation: [0.8, 1.2],
                  p_gamma: 0.3, gamma: [0.85, 1.15], p_blur: 0.15, p_noise: 0.15, p_jpeg: 0.1}
    geometric: {p_flip: 0.5, p_crop: 0.5, max_zoom: 1.25}
  val_sources: [bdd100k, tusimple, accident, baton]
  val_cap: {bdd100k: 1500, baton: 600}
  val_pair_sources: [tusimple, accident, baton]
  val_pair_cap: {tusimple: 600, accident: 600, baton: 600}
  val_batch_size: 16
  val_workers: 4
optim:
  steps: 6000
  accumulation: 1
  lr_heads: 5.0e-4
  lr_backbone: 0.0
  wd_heads: 1.0e-4
  wd_backbone: 0.05
  warmup: 300
  min_lr_ratio: 0.05
  grad_clip: 1.0
log_every: 50
eval_every: 1000
ckpt_every: 500
