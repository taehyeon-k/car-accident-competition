seed: 42
stage: stage3
root_dir: /workspace
output_dir: car-accident/runs/stage3/smoke
resume: null
data:
  manifest: data/stage3/manifests/smoke_train.jsonl
  val_manifest: data/stage3/manifests/smoke_val.jsonl
  cache_dir: cache/stage3/smoke
  statistics: cache/stage3/smoke_physics_stats.pt
  crop_frames: 16
  event_fraction: 0.5
  event_position_margin: 2
  flip_probability: 0.5
  batch_size: 1
  num_workers: 0
timing: {target_hz: 10.0, max_selection_error: 0.04, large_gap_seconds: 0.20}
flow:
  backend: opencv
  version: "farneback-smoke-only"
  source_path: null
  checkpoint: null
  checkpoint_sha256: null
  factory: null
  working_size: [96, 168]
  batch_size: 1
  device: cpu
calibration: {focal_mode: prior, hfov_prior_deg: 90.0, known_focal_px: null}
geometry: {canonical_size: [96, 168]}
targets: {smoothing_seconds: [0.5, 1.5], savgol_polyorder: 2, require_direct_acceleration: true, max_signal_gap_seconds: 0.25, stopped_speed_mps: 0.15}
model:
  motion_cnn: {widths: [32, 64, 96, 128], blocks_per_stage: 1, pooling: attention}
  physics_dropout: 0.05
  head_dropout: 0.05
  yaw_aux: true
  tcn: {dim: 128, kernel_size: 3, dilations: [1, 2, 4, 8, 16], dropout: 0.10, causal: false, padding_mode: replicate}
loss:
  weights: {accel_direct: 1.0, ordinal: 0.5, stopped: 0.5, speed: 0.2, accel_speed_consistency: 0.1, steering_angle: 0.25, yaw_aux: 0.1}
  ordinal: {samples: 4, range: [-3.0, 3.0], temperature: 0.25}
  steering_delta: 2.0
decoder:
  acceleration: {decelerating_below: -0.25, accelerating_above: 0.25, stopped_probability: 0.5, emission_scale: 0.5, potts_penalty: 1.0}
  steering: {threshold_deg: 5.0, emission_scale_deg: 5.0, potts_penalty: 1.0}
optimization: {epochs: 2, accumulation_steps: 1, mixed_precision: "no", optimizer: adamw, learning_rate: 0.003, weight_decay: 0.0, grad_clip_norm: 1.0, scheduler: cosine, warmup_ratio: 0.0, ema_decay: 0.9}
early_stopping: {enabled: false, patience: 4}
logging:
  log_every: 1
  val_every: 1
  wandb: {enabled: false, project: smoke, mode: offline}

inference:
  cnn_chunk_frames: 32
